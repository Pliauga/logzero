name: 'logzero-action'
description: 'Synthesizes tightened, least-privilege Terraform IAM policies from AWS CloudTrail events'
author: 'logzero team'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  role-arn:
    description: 'Target IAM Role ARN or Name to filter CloudTrail events'
    required: false
    default: ''
  time-window:
    description: 'Lookback duration (e.g. 15m, 30m, 1h, 24h)'
    required: false
    default: '1h'
  file:
    description: 'Path to offline CloudTrail JSON export/fixture'
    required: false
    default: ''
  output:
    description: 'Output file path for synthesized Terraform policy'
    required: false
    default: 'tightened_policy.tf'
  format:
    description: 'Output format: hcl or json'
    required: false
    default: 'hcl'
  name:
    description: 'Terraform data block identifier name'
    required: false
    default: 'tightened_policy'
  aws-region:
    description: 'AWS Region override'
    required: false
    default: 'us-east-1'

outputs:
  policy-path:
    description: 'Path to the generated policy document'
    value: ${{ inputs.output }}

runs:
  using: 'composite'
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.9'

    - name: Run logzero
      shell: bash
      run: |
        cd "${{ github.action_path }}"

        ARGS=()
        if [ -n "${{ inputs.role-arn }}" ]; then
          ARGS+=("--role-arn" "${{ inputs.role-arn }}")
        fi
        if [ -n "${{ inputs.file }}" ]; then
          ARGS+=("--file" "${{ inputs.file }}")
        else
          ARGS+=("--time-window" "${{ inputs.time-window }}")
        fi
        if [ -n "${{ inputs.aws-region }}" ]; then
          ARGS+=("--region" "${{ inputs.aws-region }}")
        fi
        ARGS+=("--output" "${{ inputs.output }}" "--format" "${{ inputs.format }}" "--name" "${{ inputs.name }}")

        echo "==> Executing: logzero ${ARGS[*]}"
        go run ./cmd/logzero "${ARGS[@]}"
