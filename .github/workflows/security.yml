name: Security & Quality Audit

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    name: Security & Test Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run Unit & Race Tests
        env:
          CGO_ENABLED: '1'
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Install & Run gosec SAST
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          $(go env GOPATH)/bin/gosec -severity high -fmt sarif -out gosec.sarif ./...

      - name: Upload gosec SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('gosec.sarif') != ''
        with:
          sarif_file: gosec.sarif
          category: gosec

      - name: Run govulncheck
        env:
          GOTOOLCHAIN: 'auto'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          $(go env GOPATH)/bin/govulncheck ./...

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['go']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
