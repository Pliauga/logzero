# LogZero — DSH Task Board
# Execute tasks in priority order, respecting depends_on.
# One task per DSH session. Review between tasks.

tasks:
  - id: LZ-100
    title: Align Go module path and config with renamed GitHub repo
    goal: Update the module path and all repo references to match github.com/Pliauga/logzero
    context: |
      The GitHub repo was renamed to 'Pliauga/logzero'. The Go module path is
      still 'github.com/logzero/logzero', which no longer matches any real repo.
      All import paths, OCI labels, GHCR image paths, and doc URLs must be updated.
    files:
      - go.mod
      - cmd/logzero/main.go
      - cmd/logzero/main_test.go
      - pkg/aws/cloudtrail.go
      - pkg/aws/cloudtrail_test.go
      - pkg/aws/cloudtrail_fuzz_test.go
      - pkg/parser/normalizer.go
      - pkg/parser/normalizer_test.go
      - pkg/synthesis/hcl.go
      - pkg/synthesis/hcl_test.go
      - .goreleaser.yaml
      - .github/workflows/release.yml
      - .github/workflows/security.yml
      - README.md
      - AGENTS.md
      - CHANGELOG.md
    steps:
      - Update 'module github.com/logzero/logzero' to 'module github.com/Pliauga/logzero' in go.mod
      - Replace all 'github.com/logzero/logzero' import paths with 'github.com/Pliauga/logzero'
      - Replace OCI label URLs in .goreleaser.yaml from 'https://github.com/logzero/logzero' to 'https://github.com/Pliauga/logzero'
      - Replace GHCR image paths from 'ghcr.io/logzero/logzero' to 'ghcr.io/pliauga/logzero' (GHCR requires lowercase owner)
      - Update the same GHCR path anywhere it appears in .github/workflows/release.yml
      - Update clone URL and Releases URL in README.md to 'https://github.com/Pliauga/logzero'
      - In the AGENTS.md Security Rules section, replace 'github.com/logzero/logzero' with 'github.com/Pliauga/logzero' and fix the broken markdown link '[DSH.md](http://DSH.md)' to '[DSH.md](DSH.md)'
      - In AGENTS.md, change 'Go 1.22' to 'Go 1.25'
      - In AGENTS.md, change all 'dsn/LZ-{id}' to 'dsh/LZ-{id}'
      - In AGENTS.md Do Not Touch, append to the go.sum line the tidy exception
      - In .github/workflows/security.yml, change go-version '1.22' to '1.25' to match go.mod
      - In .github/workflows/release.yml, change go-version '1.22' to '1.25' to match go.mod
      - Add an [Unreleased] entry to CHANGELOG.md describing the module path change
      - Run 'go mod tidy'
      - Run 'go build ./...'
      - Run 'go test -race -count=1 ./...'
    commands:
      - grep -rn "github.com/logzero/logzero" --include="*.go" --include="*.yaml" --include="*.yml" --include="*.md" . | grep -v "^./.git/" | grep -v "^./tasks/board.yaml"
      - grep -rn "ghcr.io/logzero" .goreleaser.yaml .github/workflows/ .github/ README.md | grep -v "^./.git/"
      - grep -rn "1\.22" .github/workflows/
      - go mod tidy
      - go build ./...
      - go test -race -count=1 ./...
    tests:
      - No remaining references to 'github.com/logzero/logzero' in .go source, config, or user-facing docs (tasks/board.yaml excluded — it is a historical audit trail)
      - No remaining references to 'ghcr.io/logzero' anywhere
      - No '1.22' remains in .github/workflows/
      - go build succeeds
      - go test succeeds
    done_criteria:
      - go.mod declares module github.com/Pliauga/logzero
      - All imports resolve
      - All config and docs reference the correct URL
      - Build and tests pass
    constraints:
      - Do NOT change the GitHub repo name again
      - Do NOT change the module path to all-lowercase ('pliauga') — match the URL exactly
      - Do NOT add a go install example anywhere — the rule in AGENTS.md is a prohibition, not an example
      - Preserve all other code structure
    escalation: If grep shows files not listed above, list them before editing
    depends_on: []
    parallelizable: false
    agent_role: implementer
    estimated_effort: M
    priority: P0

  - id: LZ-101
    title: Verify build and full test suite
    goal: Confirm the project builds and all tests pass with race detector
    context: Baseline verification after module-path alignment
    files: []
    steps:
      - Run 'go mod verify'
      - Run 'go build ./...'
      - Run 'go test -race -count=1 -v ./...'
      - Run 'go vet ./...'
    commands:
      - go mod verify
      - go build ./...
      - go test -race -count=1 -v ./...
      - go vet ./...
    tests:
      - All commands exit 0
      - No race conditions detected
    done_criteria:
      - All tests in ./... pass with -race
      - Build produces no errors
      - Vet produces no warnings
    constraints:
      - Do not modify any source files
      - Report-only task
    escalation: If any test fails, report the failure and stop.
    depends_on: [LZ-100]
    parallelizable: false
    agent_role: tester
    estimated_effort: S
    priority: P0

  - id: LZ-102
    title: Run security scanning tools and record baseline
    goal: Execute gosec and govulncheck and record the current findings baseline
    context: Security baseline. Tools must already be installed (see DSH.md pre-flight).
    files:
      - SECURITY-BASELINE.md
    steps:
      - Confirm gosec is installed ('gosec --version')
      - Run 'gosec ./...'
      - Confirm govulncheck is installed ('govulncheck --version')
      - Run 'govulncheck ./...'
      - Write findings to SECURITY-BASELINE.md at repo root
    commands:
      - gosec --version
      - gosec ./...
      - govulncheck --version
      - govulncheck ./...
    tests:
      - gosec runs successfully
      - govulncheck runs successfully
    done_criteria:
      - Baseline documented in SECURITY-BASELINE.md
      - Any HIGH/CRITICAL findings have a follow-up task ID
    constraints:
      - Do not install tools inside this task — they must be pre-installed
      - Do not modify source to suppress findings without a documented reason
    escalation: Report HIGH/CRITICAL findings immediately and stop.
    depends_on: [LZ-101]
    parallelizable: false
    agent_role: tester
    estimated_effort: S
    priority: P0

  - id: LZ-103
    title: Validate GoReleaser configuration
    goal: Verify .goreleaser.yaml is valid and snapshot build succeeds
    context: Distribution pipeline validation. Requires goreleaser pre-installed.
    files:
      - .goreleaser.yaml
    steps:
      - Run 'goreleaser check'
      - Run 'goreleaser build --snapshot --clean'
      - Verify binaries exist for all target platforms in dist/
    commands:
      - goreleaser check
      - goreleaser build --snapshot --clean
    tests:
      - goreleaser check exits 0
      - Snapshot build produces binaries for linux/darwin/windows on amd64/arm64
    done_criteria:
      - GoReleaser config validated
      - Snapshot binaries exist in dist/
    constraints:
      - Do not push any releases
      - Snapshot only
      - Requires goreleaser pre-installed
    escalation: If goreleaser is not installed, report and stop
    depends_on: [LZ-100, LZ-101]
    parallelizable: true
    agent_role: release-engineer
    estimated_effort: S
    priority: P1

  - id: LZ-104
    title: Pin gosec and govulncheck versions in security.yml and DSH.md
    goal: Replace '@latest' with pinned versions for reproducible CI and reproducible agent pre-flight
    context: security.yml and DSH.md both use go install ...@latest, which contradicts LogZero's supply-chain posture
    files:
      - .github/workflows/security.yml
      - DSH.md
    steps:
      - Get resolved versions from LZ-102 baseline output ('gosec --version', 'govulncheck --version')
      - Replace gosec '@latest' with the resolved version in security.yml
      - Replace govulncheck '@latest' with the resolved version in security.yml
      - In the DSH.md pre-flight section, replace '@latest' on the gosec and govulncheck install lines with the same resolved versions used in security.yml
      - Verify YAML is valid
    commands:
      - grep -n "go install" .github/workflows/security.yml
      - grep -n "@latest" DSH.md
    tests:
      - No '@latest' remains in security.yml
      - No '@latest' remains on the gosec/govulncheck install lines in DSH.md
    done_criteria:
      - gosec and govulncheck are version-pinned in CI and in the DSH.md pre-flight
    constraints:
      - Do not change any other CI behaviour
      - Version resolution happens once (LZ-102) and is applied in both places
    escalation: None
    depends_on: [LZ-100, LZ-101, LZ-102]
    parallelizable: true
    agent_role: release-engineer
    estimated_effort: S
    priority: P1

  - id: LZ-105
    title: Add container image scanning to release workflow
    goal: Scan the built container image for vulnerabilities before publishing
    context: release.yml currently has Cosign and Syft but no Grype/Trivy image scanning
    files:
      - .github/workflows/release.yml
    steps:
      - Confirm Grype or Trivy is not already invoked in release.yml
      - Add a step that runs 'grype ghcr.io/pliauga/logzero:{version} --fail-on high'
      - Place the scan between image push and release publication
    commands:
      - grep -n "grype\|trivy" .github/workflows/release.yml
    tests:
      - Workflow YAML parses
      - Grype step is present and fails on HIGH severity
    done_criteria:
      - Image scan step exists in release.yml
    constraints:
      - Do not run the workflow (no tag push)
    escalation: None
    depends_on: [LZ-103]
    parallelizable: true
    agent_role: release-engineer
    estimated_effort: S
    priority: P1

  - id: LZ-106
    title: Pin builder image by digest in Dockerfile
    goal: Pin the golang builder stage by digest and align version to 1.25
    context: Dockerfile uses 'FROM golang:1.22-alpine' which mismatches go.mod's Go 1.25.0
    files:
      - Dockerfile
    steps:
      - Resolve the current digest for golang:1.25-alpine via 'docker pull' and 'docker inspect'
      - Replace the builder FROM line with 'FROM golang:1.25-alpine@sha256:...'
      - Verify 'docker build .' still succeeds locally
    commands:
      - docker pull golang:1.25-alpine
      - docker inspect --format='{{index .RepoDigests 0}}' golang:1.25-alpine
    tests:
      - Dockerfile builds successfully
    done_criteria:
      - Builder image is digest-pinned and uses Go 1.25
    constraints:
      - Do not change the production (distroless) stage
    escalation: If the digest cannot be resolved offline, document the command in a comment
    depends_on: [LZ-100, LZ-101]
    parallelizable: true
    agent_role: release-engineer
    estimated_effort: S
    priority: P1

  - id: LZ-107
    title: Add docker_signs to .goreleaser.yaml
    goal: Sign the container image so users can verify it with cosign
    context: Binaries and checksums are signed; the image is not
    files:
      - .goreleaser.yaml
    steps:
      - Add a docker_signs block using cosign keyless signing
      - Configure it to sign all image templates in docker_manifests
      - Run 'goreleaser check' to validate
    commands:
      - goreleaser check
    tests:
      - goreleaser check passes
    done_criteria:
      - docker_signs block present and validated
    constraints:
      - Snapshot only, do not release
      - Requires goreleaser pre-installed; if absent, report blocked and stop
    escalation: If goreleaser is not installed, report and stop
    depends_on: [LZ-103]
    parallelizable: true
    agent_role: release-engineer
    estimated_effort: S
    priority: P1

  - id: LZ-108
    title: Decide and document gosec failure policy
    goal: Resolve whether gosec findings should block PRs
    context: security.yml currently uses 'gosec -no-fail'; for a security tool this is likely wrong
    files:
      - .github/workflows/security.yml
      - AGENTS.md
    steps:
      - Review current gosec findings from LZ-102 baseline
      - If findings are clean, remove '-no-fail' so gosec failures block CI
      - If findings exist, add a severity gate that fails on HIGH/CRITICAL only
      - Document the decision in AGENTS.md under Security Rules
    commands:
      - grep -n "no-fail" .github/workflows/security.yml
    tests:
      - Workflow YAML parses
    done_criteria:
      - Decision documented and implemented
    constraints:
      - Do not suppress findings without justification
    escalation: If uncertain, propose both options and stop for human decision
    depends_on: [LZ-102]
    parallelizable: true
    agent_role: release-engineer
    estimated_effort: S
    priority: P1

  - id: LZ-109
